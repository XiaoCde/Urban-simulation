<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>华盛顿 · 程序化 three.js 重建</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0c0f; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; left: 20px; bottom: 18px; z-index: 10;
    font: 13px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #cfd6e0; text-shadow: 0 1px 4px rgba(0,0,0,.85);
    pointer-events: none; user-select: none; letter-spacing: .01em;
  }
  #hud b { color: #fff; font-weight: 600; letter-spacing: .03em; }
  #hud .k { color: #8da3bb; }
  #hud .n { color: #7f94ab; font-variant-numeric: tabular-nums; }
  #views {
    position: fixed; right: 16px; top: 14px; z-index: 12;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    font: 12px/1 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  #views button {
    pointer-events: auto; cursor: pointer;
    background: rgba(16,20,26,.72); color: #cfd6e0;
    border: 1px solid rgba(140,160,185,.28); border-radius: 7px;
    padding: 7px 11px; letter-spacing: .04em;
    backdrop-filter: blur(6px); transition: all .15s ease;
  }
  #views button:hover { background: rgba(40,58,80,.9); border-color: rgba(150,190,235,.6); color: #fff; }
  #views button.on { background: rgba(56,110,168,.92); border-color: #7fb4e8; color: #fff; }
  /* 积涝叠层面板（flood.js）：平时隐藏，按 F 才出来 */
  #flood { position: fixed; right: 18px; bottom: 96px; z-index: 20; display: none;
           width: 232px; padding: 10px 12px 11px; border-radius: 10px;
           background: rgba(8,16,26,.82); border: 1px solid rgba(120,170,225,.35);
           color: #d7e6f7; font: 12px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
           backdrop-filter: blur(6px); }
  #flood .row { display: flex; align-items: center; gap: 8px; }
  #flood b { font-size: 13px; letter-spacing: .06em; color: #bfe0ff; }
  #flTime { margin-left: auto; font-variant-numeric: tabular-nums; color: #8fb6dc; }
  #flRange { width: 100%; margin: 8px 0 6px; accent-color: #4b96e0; }
  /* 图例：0 → 2 m 的深度渐变，和 flood.js 着色器同一套颜色 */
  #flood .legend { display: flex; align-items: center; gap: 6px; margin-top: 4px;
                   font-size: 10px; color: #7f9cba; }
  #flood .legend i { flex: 1; height: 6px; border-radius: 3px;
                     background: linear-gradient(90deg, rgba(153,189,199,.92) 0%,
                                 rgba(95,150,190,.95) 40%, rgba(38,86,140,.96) 70%,
                                 rgba(13,38,77,.97) 100%); }
  #flood button { padding: 3px 10px; border-radius: 6px; cursor: pointer;
                  background: rgba(28,46,68,.95); color: #cfe2f5;
                  border: 1px solid rgba(120,170,225,.4); }
  #flood button:hover { background: rgba(40,70,105,.95); color: #fff; }
  #flood .hint { margin-left: auto; color: #6f8aa6; }
  #flood .lbl { color: #8fb6dc; }
  #flood select { flex: 1; padding: 2px 4px; border-radius: 6px; cursor: pointer;
                  background: rgba(28,46,68,.95); color: #cfe2f5;
                  border: 1px solid rgba(120,170,225,.4);
                  font: inherit; }
  #flood select:hover { background: rgba(40,70,105,.95); color: #fff; }
  #views .t { color: #6b7f96; font-size: 11px; letter-spacing: .1em; margin-bottom: 1px; }
  #loading {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: #0a0c0f; color: #7f94ab;
    font: 14px/1 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    letter-spacing: .1em; transition: opacity .6s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <b>华盛顿 · Washington, D.C.</b><br />
  <span class="k">地形 USGS 3DEP 1 m · 下垫面 DCGIS 2025</span><br />
  <span class="k">拖拽旋转 · 滚轮缩放 · 右键平移 · 数字键 1–0 切机位 · F 键积涝</span><br />
  <span class="n" id="stat"></span>
</div>
<div id="views">
  <div class="t">机位</div>
  <button data-v="city">1 城市总览</button>
  <button data-v="mall">2 国家广场</button>
  <button data-v="capitol">3 国会山穹顶</button>
  <button data-v="rowhouses">4 连排屋街区</button>
  <button data-v="street">5 街道平视</button>
  <button data-v="river">6 波托马克河岸</button>
  <button data-v="whitehouse">7 白宫</button>
  <button data-v="tidal">8 潮汐湖</button>
  <button data-v="crowd">9 行人近景</button>
  <button data-v="crowdTop">0 行人俯视</button>
</div>
<!-- 积涝叠层：按 F 打开。时间轴从降雨到退水，水位会自己退下去。 -->
<div id="flood">
  <div class="row"><b>积涝</b><span id="flTime">t=0 min</span></div>
  <div class="row" style="margin-top:6px">
    <span class="lbl">暴雨时长</span>
    <select id="flCase">
      <option value="">2 h 短历时（默认）</option>
      <option value="sc_6h">6 h · 40 mm/h</option>
      <option value="sc_12h">12 h · 32 mm/h</option>
      <option value="sc_24h">24 h · 26 mm/h</option>
      <option value="sc_72h">72 h · 18 mm/h</option>
    </select>
  </div>
  <input id="flRange" type="range" min="0" max="0" value="0" step="1">
  <div class="legend"><span>浅</span><i></i><span>深 2 m+</span></div>
  <div class="row">
    <button id="flPlay">播放</button>
    <button id="flClose">关闭</button>
    <span class="hint">F 开关</span>
  </div>
</div>
<div id="loading">正在程序化生成…</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
